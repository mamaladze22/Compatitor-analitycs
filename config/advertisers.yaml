# Tracked competitors. Page IDs are source of truth — names change, IDs don't.
#
# To populate page_id for a new entry:
#   1. Open the Page URL in browser
#   2. Visit https://www.facebook.com/ads/library/?active_status=all&ad_type=all&country=GE
#   3. Search the brand and copy the page_id from the URL bar (view_all_page_id=...)
#   OR run: python scripts/fetch_ads.py --resolve-only
#
# slug is a stable internal identifier used in the Sheet and reports. Use
# kebab-case, lowercase ASCII only.

advertisers:
